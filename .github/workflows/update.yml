name: 发布捡漏雷达网页

# 数据由 Claude 定时任务每 6 小时读取后推送到仓库（GitHub 的服务器会被什么值得买拦截）。
# 每次推送后，这里用仓库里的数据生成网页并发布到 GitHub Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成网页数据
        run: python scripts/update.py --build-only
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
